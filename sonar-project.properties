# can sign in deterministically. Not real production secrets.
sonar.issue.ignore.multicriteria=demo-seeder-credentials
sonar.issue.ignore.multicriteria.demo-seeder-credentials.ruleKey=php:S2068
sonar.issue.ignore.multicriteria.demo-seeder-credentials.resourceKey=**/Database/Seeders/**Test*Seeder.php
